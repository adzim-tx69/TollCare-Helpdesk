<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Laporan - TollCare</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #1e3a5f;
        }

        .navbar {
            height: 70px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 35px;
            box-shadow: 0 2px 10px rgba(0,0,0,.08);
        }

        .logo {
            color: #2563eb;
            font-size: 24px;
            font-weight: bold;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            padding: 35px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,.06);
        }

        h1 {
            margin-top: 0;
        }

        .subtitle {
            color: #64748b;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #dbe2ea;
            border-radius: 8px;
            font-size: 15px;
        }

        textarea {
            min-height: 150px;
            resize: vertical;
        }

        .btn {
            border: none;
            padding: 13px 22px;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            cursor: pointer;
            font-size: 15px;
        }

        .back {
            display: inline-block;
            margin-bottom: 20px;
            color: #2563eb;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <div class="logo">
            TollCare Helpdesk
        </div>

        <a href="{{ url_for('karyawan_dashboard') }}">
            Dashboard
        </a>
    </nav>

    <main class="container">

        <a href="{{ url_for('karyawan_dashboard') }}"
           class="back">
            ← Kembali ke Dashboard
        </a>

        <div class="card">

            <h1>Buat Laporan</h1>

            <p class="subtitle">
                Silakan isi laporan dengan lengkap dan jelas.
            </p>

            <form method="POST">

                <div class="form-group">

                    <label>
                        Judul Laporan
                    </label>

                    <input
                        type="text"
                        name="judul"
                        placeholder="Masukkan judul laporan"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Lokasi
                    </label>

                    <input
                        type="text"
                        name="lokasi"
                        placeholder="Masukkan lokasi kejadian"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Kategori
                    </label>

                    <select name="kategori">

                        <option value="">
                            Pilih kategori
                        </option>

                        <option value="gangguan">
                            Gangguan
                        </option>

                        <option value="kecelakaan">
                            Kecelakaan
                        </option>

                        <option value="jalan">
                            Kondisi Jalan
                        </option>

                        <option value="lainnya">
                            Lainnya
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label>
                        Deskripsi
                    </label>

                    <textarea
                        name="deskripsi"
                        placeholder="Jelaskan laporan..."
                        required
                    ></textarea>

                </div>


                <button
                    type="submit"
                    class="btn">
                    Kirim Laporan
                </button>

            </form>

        </div>

    </main>

</body>
</html>
