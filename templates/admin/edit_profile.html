<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Profil Admin</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">

    <style>

        body{

            background:#f4f7fb;

            font-family:'Poppins',sans-serif;

        }

        .card{

            margin-top:40px;

            border:none;

            border-radius:18px;

            overflow:hidden;

            box-shadow:0 10px 30px rgba(0,0,0,.12);

        }

        .card-header{

            background:#2563eb;

            color:white;

            font-size:22px;

            font-weight:600;

            padding:18px;

        }

        .profile-photo{

            width:170px;

            height:170px;

            object-fit:cover;

            border-radius:50%;

            border:5px solid #2563eb;

        }

        .btn{

            border-radius:10px;

        }

    </style>

</head>

<body>

<div class="container">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card">

                <div class="card-header">

                    <i class="fa-solid fa-user-pen"></i>

                    Edit Profil Admin

                </div>

                <div class="card-body">

                    <form
                        action="{{ url_for('update_profile') }}"                    
                        method="POST"
                        enctype="multipart/form-data">

                        <div class="text-center mb-4">

                            {% if admin.photo and admin.photo != "default.png" %}

                            <img
                                src="{{ url_for('static', filename='uploads/admin/' + admin.photo) }}"
                                class="profile-photo">

                            {% else %}

                            <img
                                src="{{ url_for('static', filename='uploads/admin/default.png') }}"
                                class="profile-photo">

                            {% endif %}

                        </div>

                        <div class="mb-4">

                            <label class="form-label">

                                Foto Profil

                            </label>

                            <input
                                type="file"
                                name="photo"
                                class="form-control"
                                accept=".jpg,.jpeg,.png">

                            <small class="text-muted">

                                Format: JPG, JPEG, PNG

                            </small>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Nama Lengkap

                            </label>

                            <input
                                type="text"
                                name="fullname"
                                class="form-control"
                                value="{{ admin.fullname }}"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Email

                            </label>

                            <input
                                type="email"
                                name="email"
                                class="form-control"
                                value="{{ admin.email or '' }}">

                        </div>

                        <div class="mb-4">

                            <label class="form-label">

                                Nomor HP

                            </label>

                            <input
                                type="text"
                                name="phone"
                                class="form-control"
                                value="{{ admin.phone or '' }}">

                        </div>

                        <div class="d-flex gap-2">

                            <button
                                type="submit"
                                class="btn btn-primary">

                                <i class="fa-solid fa-floppy-disk"></i>

                                Simpan Perubahan

                            </button>

                            <a
                                href="/admin/profile"
                                class="btn btn-secondary">

                                <i class="fa-solid fa-arrow-left"></i>

                                Kembali

                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
