<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Tambah Karyawan - TollCare</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #1e3a5f;
        }

        .navbar {
            height: 70px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 35px;
            box-shadow: 0 2px 10px rgba(0,0,0,.08);
        }

        .logo {
            color: #2563eb;
            font-size: 24px;
            font-weight: bold;
        }

        .navbar a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }

        .container {
            max-width: 800px;
            margin: auto;
            padding: 35px;
        }

        .back {
            display: inline-block;
            margin-bottom: 20px;
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,.06);
        }

        h1 {
            margin-top: 0;
        }

        .subtitle {
            color: #64748b;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #dbe2ea;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
        }

        .btn {
            border: none;
            padding: 13px 22px;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
        }

        .btn:hover {
            background: #1d4ed8;
        }

        .flash {
            padding: 12px 15px;
            margin-bottom: 20px;
            border-radius: 8px;
            background: #fee2e2;
            color: #991b1b;
        }

    </style>

</head>

<body>

    <nav class="navbar">

        <div class="logo">
            TollCare Helpdesk
        </div>

        <a href="{{ url_for('admin_karyawan') }}">
            Kelola Karyawan
        </a>

    </nav>


    <main class="container">

        <a
            href="{{ url_for('admin_karyawan') }}"
            class="back"
        >
            ← Kembali
        </a>


        <div class="card">

            <h1>
                Tambah Karyawan
            </h1>

            <p class="subtitle">
                Buat akun baru untuk karyawan.
            </p>


            {% with messages = get_flashed_messages(
                with_categories=true
            ) %}

                {% if messages %}

                    {% for category, message in messages %}

                        <div class="flash">
                            {{ message }}
                        </div>

                    {% endfor %}

                {% endif %}

            {% endwith %}


            <form
                method="POST"
            >

                <div class="form-group">

                    <label for="fullname">
                        Nama Lengkap
                    </label>

                    <input
                        type="text"
                        id="fullname"
                        name="fullname"
                        placeholder="Nama lengkap karyawan"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Username untuk login"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Email karyawan"
                    >

                </div>


                <div class="form-group">

                    <label for="phone">
                        Nomor Telepon
                    </label>

                    <input
                        type="text"
                        id="phone"
                        name="phone"
                        placeholder="08xxxxxxxxxx"
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Password login"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn"
                >
                    Simpan Karyawan
                </button>

            </form>

        </div>

    </main>

</body>

</html>
