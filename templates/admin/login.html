<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Login Admin - TollCare</title>


    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- Font Awesome -->

    <link
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        rel="stylesheet">


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }


        body {

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 20px;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #1e3a8a
                );

        }


        /* =========================================
           LOGIN CARD
        ========================================= */

        .login-card {

            width: 380px;

            max-width: 100%;

            background: #ffffff;

            border-radius: 18px;

            overflow: hidden;

            box-shadow:
                0 20px 40px
                rgba(0, 0, 0, 0.25);

        }


        /* =========================================
           HEADER
        ========================================= */

        .login-header {

            background: #2563eb;

            color: #ffffff;

            text-align: center;

            padding: 30px 20px;

        }


        .login-header i {

            font-size: 48px;

            margin-bottom: 10px;

        }


        .login-header h3 {

            margin: 0;

            font-size: 28px;

            font-weight: 700;

        }


        .login-header small {

            display: block;

            margin-top: 5px;

            font-size: 14px;

            opacity: .9;

        }


        /* =========================================
           BODY
        ========================================= */

        .login-body {

            padding: 30px;

        }


        .form-label {

            font-weight: 600;

            color: #334155;

        }


        .form-control {

            height: 50px;

            border-radius: 10px;

            border: 1px solid #cbd5e1;

            padding: 10px 14px;

        }


        .form-control:focus {

            border-color: #2563eb;

            box-shadow:
                0 0 0 3px
                rgba(37, 99, 235, .15);

        }


        /* =========================================
           BUTTON LOGIN
        ========================================= */

        .btn-login {

            height: 50px;

            border-radius: 10px;

            font-weight: 600;

            background: #2563eb;

            border: none;

            transition:
                .25s ease;

        }


        .btn-login:hover {

            background: #555b60;

            transform:
                translateY(-2px);

            box-shadow:
                0 8px 18px
                rgba(0, 0, 0, .20);

        }


        /* =========================================
           BACK TO HOME
        ========================================= */

        .back-home {

            display: block;

            text-align: center;

            margin-top: 20px;

            color: #64748b;

            text-decoration: none;

            font-size: 14px;

        }


        .back-home:hover {

            color: #2563eb;

        }


        /* =========================================
           FLASH MESSAGE
        ========================================= */

        .alert {

            border-radius: 10px;

            font-size: 14px;

        }


        /* =========================================
           LOADING
        ========================================= */

        #loading {

            position: fixed;

            top: 0;

            left: 0;

            width: 100%;

            height: 100%;

            background:
                rgba(255, 255, 255, .85);

            display: none;

            justify-content: center;

            align-items: center;

            z-index: 99999;

        }


        .loader {

            width: 65px;

            height: 65px;

            border: 7px solid #ddd;

            border-top:
                7px solid #2563eb;

            border-radius: 50%;

            animation:
                spin 1s linear infinite;

        }


        @keyframes spin {

            from {

                transform:
                    rotate(0deg);

            }

            to {

                transform:
                    rotate(360deg);

            }

        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 500px) {

            body {

                padding: 15px;

            }


            .login-card {

                width: 100%;

            }


            .login-header {

                padding: 25px 20px;

            }


            .login-header i {

                font-size: 40px;

            }


            .login-header h3 {

                font-size: 25px;

            }


            .login-body {

                padding: 25px 20px;

            }


            .form-control,
            .btn-login {

                height: 48px;

            }

        }

    </style>

</head>


<body>


    <!-- =========================================
         LOADING
    ========================================= -->

    <div id="loading">

        <div class="loader"></div>

    </div>



    <!-- =========================================
         LOGIN CARD
    ========================================= -->

    <div class="login-card">


        <!-- HEADER -->

        <div class="login-header">

            <i class="fa-solid fa-road"></i>

            <h3>

                TollCare

            </h3>

            <small>

                Admin Login

            </small>

        </div>



        <!-- BODY -->

        <div class="login-body">


            <!-- FLASH MESSAGE -->

            {% with messages = get_flashed_messages(with_categories=true) %}

                {% if messages %}

                    {% for category, message in messages %}

                        <div
                            class="alert alert-{{ category }}"
                            role="alert">

                            {{ message }}

                        </div>

                    {% endfor %}

                {% endif %}

            {% endwith %}



            <!-- LOGIN FORM -->

            <form
                method="POST"
                action="{{ url_for('admin_login') }}"
                id="loginForm">


                <!-- USERNAME -->

                <div class="mb-3">

                    <label
                        class="form-label">

                        Username

                    </label>


                    <input
                        type="text"
                        name="username"
                        class="form-control"
                        placeholder="Masukkan username"
                        autocomplete="username"
                        required>

                </div>



                <!-- PASSWORD -->

                <div class="mb-4">

                    <label
                        class="form-label">

                        Password

                    </label>


                    <input
                        type="password"
                        name="password"
                        class="form-control"
                        placeholder="Masukkan password"
                        autocomplete="current-password"
                        required>

                </div>



                <!-- LOGIN -->

                <button
                    type="submit"
                    class="btn btn-primary btn-login w-100">

                    <i
                        class="fa-solid fa-right-to-bracket">
                    </i>

                    Login Admin

                </button>


            </form>



            <!-- BACK TO PUBLIC WEBSITE -->

            <a
                href="{{ url_for('index') }}"
                class="back-home">

                <i class="fa-solid fa-arrow-left"></i>

                Kembali ke Website Masyarakat

            </a>


        </div>

    </div>



    <!-- =========================================
         JAVASCRIPT
    ========================================= -->

    <script>

        const form =
            document.getElementById("loginForm");

        const loading =
            document.getElementById("loading");


        form.addEventListener(
            "submit",
            function () {

                loading.style.display = "flex";

            }
        );

    </script>


</body>

</html>
