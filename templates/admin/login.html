<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login Admin - TollCare</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }

        body{

            min-height:100vh;

            display:flex;

            justify-content:center;

            align-items:center;

            background:linear-gradient(135deg,#2563eb,#1e3a8a);

        }

        .login-card{

    width:360px;
    max-width:92%;

    background:#fff;

    border-radius:18px;

    overflow:hidden;

    box-shadow:0 15px 30px rgba(0,0,0,.2);



        }
.login-header{

    background:#2563eb;

    color:#fff;

    text-align:center;

    padding:22px;

}

      .login-header i{

    font-size:42px;

    margin-bottom:8px;

}

        .login-header h3{

            margin:0;

            font-weight:700;

        }

        .card-body{

            padding:24px;

        }

        .form-control{

            height:50px;

            border-radius:10px;

        }

        .btn-login{

            height:50px;

            border-radius:10px;

            font-weight:600;

        }

        

        /* ==========================
           Loading Spinner
        ========================== */

        #loading{

            position:fixed;

            top:0;

            left:0;

            width:100%;

            height:100%;

            background:rgba(255,255,255,.85);

            display:none;

            justify-content:center;

            align-items:center;

            z-index:99999;

        }

        .loader{

            width:70px;

            height:70px;

            border:8px solid #ddd;

            border-top:8px solid #2563eb;

            border-radius:50%;

            animation:spin 1s linear infinite;

        }

        @keyframes spin{

            from{

                transform:rotate(0deg);

            }

            to{

                transform:rotate(360deg);

            }

        }

        @media (max-width:768px){

    body{

        padding:20px;

    }

    .login-card{

        width:100%;
        max-width:360px;
    }

    .login-header{

        padding:18px;
    }

    .login-header i{

        font-size:36px;
    }

    .login-header h3{

        font-size:28px;
    }

    .card-body{

        padding:20px;
    }

    .form-control,
    .btn-login{

        height:46px;
    }

}

    </style>

</head>

<body>

<div id="loading">

    <div class="loader"></div>

</div>

<div class="login-card">

    <div class="login-header">

        <i class="fa-solid fa-road"></i>

        <h3>TollCare</h3>

        <small>Admin Login</small>

    </div>

    <div class="card-body">

        <form method="POST" id="loginForm">

            <div class="mb-3">

                <label class="form-label">

                    Username

                </label>

                <input
                    type="text"
                    name="username"
                    class="form-control"
                    required>

            </div>

            <div class="mb-4">

                <label class="form-label">

                    Password

                </label>

                <input
                    type="password"
                    name="password"
                    class="form-control"
                    required>

            </div>

            <button
                type="submit"
                class="btn btn-primary btn-login w-100">

                <i class="fa-solid fa-right-to-bracket"></i>

                Login

            </button>

        </form>

    </div>

</div>

{% with messages = get_flashed_messages(with_categories=true) %}
{% if messages %}

<div
id="flash-data"
data-category="{{ messages[0][0] }}"
data-message="{{ messages[0][1] }}">
</div>

{% endif %}
{% endwith %}

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>

const flashData = document.getElementById("flash-data");

if(flashData){

    let icon = "info";

    if(flashData.dataset.category === "success"){

        icon = "success";

    }

    if(flashData.dataset.category === "danger"){

        icon = "error";

    }

    if(flashData.dataset.category === "warning"){

        icon = "warning";

    }

    Swal.fire({

        icon:icon,

        title:flashData.dataset.message,

        timer:2000,

        showConfirmButton:false

    });

}

document.getElementById("loginForm").addEventListener("submit",function(){

    document.getElementById("loading").style.display="flex";

});

</script>

</body>

</html>
